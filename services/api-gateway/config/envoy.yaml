admin:
  access_log_path: "/tmp/envoy_admin_access.log"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_rest_to_grpc
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: rest_to_grpc
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: grpc_virtual_host
              domains: ["*"]
              routes:
              - match:
                  prefix: "/v1/invoker"
                route:
                  cluster: invoker_service
          http_filters:
            - name: envoy.filters.http.grpc_json_transcoder
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                proto_descriptor: "/etc/envoy/proto.pb"
                services: ["cri.InvokerService"]
                print_options:
                  add_whitespace: true
                  always_print_primitive_fields: true
                  preserve_proto_field_names: true
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: invoker_service
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: invoker_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: invoker
                port_value: 50052

